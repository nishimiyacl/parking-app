<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駐車場一括検索</title>
    <style>
        body { font-family: sans-serif; padding: 25px 15px; text-align: center; max-width: 480px; margin: 0 auto; background: #f8f9fa; }
        h1 { font-size: 20px; color: #333; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; }
        input { font-size: 16px; padding: 12px; width: 100%; box-sizing: border-box; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { font-size: 15px; font-weight: bold; padding: 14px; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-akippa { background-color: #28a745; }
        .btn-tokup { background-color: #ffc107; color: #333; }
        .btn-tbimes { background-color: #17a2b8; }
    </style>
</head>
<body>
    <h1>🚗 駐車場一括検索</h1>
    <p>目的地を入力し、開きたいサイトのボタンを押してください。</p>
    
    <input type="text" id="keyword" placeholder="例：藤沢駅 南口">

    <div class="btn-group">
        <button class="btn-akippa" onclick="openSite('akippa')">1. アキッパ (akippa) で検索</button>
        <button class="btn-tokup" onclick="openSite('tokup')">2. 特P で検索</button>
        <button class="btn-tbimes" onclick="openSite('tbimes')">3. タイムズのB で検索</button>
    </div>

    <script>
        function openSite(site) {
            var kw = document.getElementById('keyword').value.trim();
            if (!kw) {
                alert('目的地を入力してください');
                return;
            }
            var encodedKw = encodeURIComponent(kw);
            
            if (site === 'akippa') {
                window.open('https://www.akippa.com/search/keyword/' + encodedKw, '_blank');
            } else if (site === 'tokup') {
                window.open('https://toku-p.earth-car.com/parking-search/' + encodedKw, '_blank');
            } else if (site === 'tbimes') {
                window.open('https://btimes.jp/spark/search/list?kw=' + encodedKw, '_blank');
            }
        }
    </script>
</body>
</html>
